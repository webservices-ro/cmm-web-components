<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Popup Test</title>

  <style>
    body {
      color: #304457;
      font-family: Verdana, Arial, sans-serif;
      margin: 40px;
    }

    .page-content {
      height: 2000px;
    }

    .therapy-popup {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      pointer-events: none;
    }

    .therapy-popup::before {
      position: absolute;
      inset: 0;
      background: rgba(16, 31, 45, 0.58);
      content: "";
    }

    .therapy-popup.is-visible {
      display: flex;
    }

    .therapy-popup__dialog {
      position: relative;
      width: 100%;
      max-width: 600px;
      padding: 48px;
      background: #faf8f2;
      border: 1px solid #dce6ec;
      border-top: 4px solid #35698f;
      border-radius: 3px;
      box-shadow: 0 22px 60px rgba(16, 31, 45, 0.3);
      pointer-events: auto;
      text-align: center;
    }

    .therapy-popup__close {
      position: absolute;
      top: 12px;
      right: 16px;
      border: 0;
      background: transparent;
      color: #183b61;
      font: 30px/1 Verdana, Arial, sans-serif;
      cursor: pointer;
    }

    .therapy-popup__eyebrow {
      color: #35698f;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.13em;
      margin: 0 0 12px;
      text-transform: uppercase;
    }

    .therapy-popup h2 {
      color: #183b61;
      font-family: Cambria, Georgia, serif;
      font-size: 36px;
      font-weight: 600;
      line-height: 1.1;
      margin: 0 0 18px;
    }

    .therapy-popup__text {
      color: #5d7080;
      font-size: 15px;
      line-height: 1.7;
      margin: 0 auto;
      max-width: 470px;
    }

    .therapy-popup__actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 28px;
    }

    .therapy-popup__button {
      align-items: center;
      background: #35698f;
      border: 1px solid #35698f;
      border-radius: 3px;
      color: #fff;
      display: inline-flex;
      font-size: 11px;
      font-weight: 700;
      justify-content: center;
      letter-spacing: 0.055em;
      min-height: 48px;
      padding: 13px 21px;
      text-decoration: none;
    }

    .therapy-popup__button:hover {
      background: #183b61;
      border-color: #183b61;
    }

    .therapy-popup__button--secondary {
      background: transparent;
      color: #35698f;
    }

    .therapy-popup__button--secondary:hover {
      background: #35698f;
      border-color: #35698f;
      color: #fff;
    }

    .therapy-popup__button:focus-visible,
    .therapy-popup__close:focus-visible {
      outline: 3px solid #c8aa70;
      outline-offset: 3px;
    }

    @media (max-width: 560px) {
      .therapy-popup__dialog { padding: 42px 24px 30px; }
      .therapy-popup h2 { font-size: 30px; }
      .therapy-popup__actions { flex-direction: column; }
    }
  </style>
</head>

<body>

  <h1>Popup test page</h1>

  <div class="page-content">
    <p>Wait 30 seconds, scroll down, then back up a little.</p>
    <p>The popup should appear.</p>
  </div>

  <div id="therapy-popup" class="therapy-popup" aria-hidden="true">
    <div
      class="therapy-popup__dialog"
      role="dialog"
      aria-labelledby="therapy-popup-title"
    >
      <button
        type="button"
        class="therapy-popup__close"
        aria-label="Închide"
      >
        ×
      </button>

      <p class="therapy-popup__eyebrow">Continuă călătoria</p>
      <h2 id="therapy-popup-title">Unde vrei să mergi mai departe?</h2>

      <p class="therapy-popup__text">
        Alege spațiul potrivit pentru tine: descoperă Centrul Sakura sau află mai multe despre activitatea Claudiei Maria.
      </p>

      <div class="therapy-popup__actions">
        <a href="https://centrulsakura.ro" class="therapy-popup__button">CENTRUL SAKURA</a>
        <a href="https://claudiamaria.ro" class="therapy-popup__button therapy-popup__button--secondary">CLAUDIA MARIA</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {

      const popup = document.getElementById('therapy-popup');
      const closeButton = popup.querySelector('.therapy-popup__close');

      let timeReady = false;
      let scrollReady = false;
      let popupShown = false;
      let furthestScrollY = window.scrollY;
      let scrolledDown = false;

      function showPopup() {
        if (popupShown) return;

        popupShown = true;

        popup.classList.add('is-visible');
        popup.setAttribute('aria-hidden', 'false');
      }

      function maybeShowPopup() {
        if (timeReady && scrollReady) {
          showPopup();
        }
      }

      function closePopup() {
        popup.classList.remove('is-visible');
        popup.setAttribute('aria-hidden', 'true');
      }

      // Wait at least 30 seconds before showing the popup.
      setTimeout(function () {
        timeReady = true;
        maybeShowPopup();
      }, 30000);

      function checkScroll() {
        const scrollableHeight =
          document.documentElement.scrollHeight - window.innerHeight;

        if (scrollableHeight <= 0) return;

        const percentage =
          (window.scrollY / scrollableHeight) * 100;

        if (percentage >= 5) {
          scrolledDown = true;
        }

        furthestScrollY = Math.max(furthestScrollY, window.scrollY);

        if (scrolledDown && window.scrollY <= furthestScrollY - 40) {
          scrollReady = true;
          maybeShowPopup();
        }
      }

      window.addEventListener('scroll', checkScroll, { passive: true });

      closeButton.addEventListener('click', closePopup);
    });
  </script>

</body>
</html>
