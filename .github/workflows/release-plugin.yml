name: Release WordPress plugin

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read module configuration
        id: module
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const config = JSON.parse(readFileSync('module.config.json', 'utf8'))
          appendFileSync(process.env.GITHUB_OUTPUT, `slug=${config.slug}\nrelease_repository=${config.releaseRepository}\nname=${config.name}\n`)
          NODE

      - name: Validate release version
        id: version
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "${tag_version}" != "${package_version}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
              exit 1
            fi
          fi
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${package_version}" >> "${GITHUB_OUTPUT}"

      - name: Build plugin ZIP
        run: npm run package

      - name: Prepare release assets
        shell: bash
        env:
          MODULE_SLUG: ${{ steps.module.outputs.slug }}
          MODULE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp "release/${MODULE_SLUG}-${MODULE_VERSION}.zip" "release/${MODULE_SLUG}.zip"
          node scripts/create-update-manifest.mjs release/update.json

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_REPOSITORY: ${{ steps.module.outputs.release_repository }}
          MODULE_NAME: ${{ steps.module.outputs.name }}
          MODULE_SLUG: ${{ steps.module.outputs.slug }}
          MODULE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release/$MODULE_SLUG.zip" \
            release/update.json \
            --repo "$RELEASE_REPOSITORY" \
            --target main \
            --title "$MODULE_NAME $MODULE_VERSION" \
            --notes "WordPress plugin release $MODULE_VERSION." \
            --latest
